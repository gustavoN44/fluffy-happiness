name: CI

# Runs on every push and pull request. Deliberately contains NOTHING that needs an
# API key, a database, or network access to a paid provider — see DECISIONS.md D11.
# The consequence is that this job is fast, free, deterministic, and works on pull
# requests from forks (where repository secrets are unavailable by design).
# Quality regressions are watched by the separate, manually-triggered evaluation
# workflow instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (no API, no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check app eval tests

      - name: Unit tests
        # A dummy key satisfies Settings' import-time validation. No request is ever
        # made with it: any test that would need a real one does not belong here.
        env:
          OPENAI_API_KEY: sk-test-not-a-real-key
          DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
        run: pytest tests/test_units.py -v

  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Proves the Dockerfiles are valid and the app's dependency tree still
      # resolves — the compose-command exit criterion is worth guarding, and this
      # catches a broken build without needing to run the stack.
      - name: Build API image
        run: docker build -t rag-eval-api:ci .

      - name: Build frontend image
        run: docker build -t rag-eval-web:ci ./frontend
