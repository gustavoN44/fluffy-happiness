name: Evaluation

# The API-dependent half of the harness, split out of CI on purpose (DECISIONS.md D11).
#
# It is NOT on push: a full generation run is ~350 OpenAI requests and was observed
# exhausting the daily quota twice during Phase 5. A gate that goes red because of a
# rate limit rather than a regression teaches people to ignore the gate.
#
# It REPORTS but never fails. Thresholds were considered and rejected for now: with
# 35 questions, differences between good configurations are not statistically
# separable (FINDINGS.md F6), so a numeric floor would mostly encode noise. The job
# writes results to the run summary for a human to read.
#
# On-demand ONLY, with no cron schedule. A weekly run was written and then removed:
# GitHub disables scheduled workflows in public repos after ~60 days without commit
# activity, which is the normal resting state of a finished project — so the schedule
# would have switched itself off at exactly the point its stated purpose (catching
# drift in the models we call) started to matter. Unattended spend producing a report
# nobody reads, that silently stops, is worse than no schedule: it implies monitoring
# that is not happening.

on:
  workflow_dispatch:
    inputs:
      generation:
        description: "Also run the RAGAS generation metrics (slow, billed)"
        type: boolean
        default: false

jobs:
  evaluate:
    name: Retrieval metrics${{ inputs.generation && ' + generation' || '' }}
    runs-on: ubuntu-latest
    # No fork guard is needed: workflow_dispatch can only be triggered by someone with
    # write access to THIS repository, so a fork can never reach the secrets below.

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-eval.txt

      - name: Apply schema
        # The db/init scripts only run on a fresh volume for the local compose setup;
        # the CI service container needs them applied explicitly.
        run: |
          # psql is preinstalled on the ubuntu runner image. Only fetch it if that
          # ever stops being true — and update the package index first, since a stale
          # one makes a bare `apt-get install` fail.
          command -v psql >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          }
          for f in db/init/*.sql; do PGPASSWORD=rag psql -h localhost -U rag -d rag -f "$f"; done

      - name: Ingest corpus
        # --config production: evaluate the configuration the API actually SERVES,
        # not the Phase 1 baseline. Watching the wrong config would be worse than
        # watching nothing, because it would look like coverage.
        run: python -m app.store data/mota-origenes.pdf --config production

      - name: Retrieval metrics
        run: python -m eval.retrieval_metrics --config production | tee retrieval.txt

      - name: Generation metrics
        if: inputs.generation
        run: python -m eval.generation_metrics --config production | tee generation.txt

      - name: Publish to run summary
        if: always()
        run: |
          {
            echo "## Evaluation results"
            echo '```'
            cat retrieval.txt 2>/dev/null || echo "retrieval metrics did not run"
            echo '```'
            if [ -f generation.txt ]; then
              echo '```'
              cat generation.txt
              echo '```'
            fi
            echo "_Reported, not enforced — see DECISIONS.md D11._"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/
          if-no-files-found: ignore
