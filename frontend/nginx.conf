server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: unknown paths resolve to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API. The browser only ever talks to this server, so no CORS
    # configuration exists anywhere to get wrong.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Generation can take a few seconds; the default 60s is enough but explicit
        # beats implicit for the one call that is expected to be slow.
        proxy_read_timeout 120s;
    }
}
